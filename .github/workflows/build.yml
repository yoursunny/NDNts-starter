name: build
on:
  push:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Launch NFD
        run: |
          docker run -d --name nfd \
            -v /run/nfd:/run/nfd \
            ghcr.io/named-data/nfd:20260505
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: npm install
      - name: Check code style
        run: npm run lint && git diff --exit-code
      - name: Start producer
        run: node producer.mjs &
      - name: Run single consumer
        run: |
          A=$RANDOM
          B=$RANDOM
          echo $A + $B = $(node consumer.mjs $A $B)
      - name: Run bulk consumer
        run: node bulk.mjs
      - name: Stop producer
        run: pkill -f producer.mjs
# to update actions: npx actions-up
